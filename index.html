<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Seating</title>
<style>
  :root {
    --bg: #f5f3ee; --ink: #1d1d1b; --table: #fff; --line: #cfc9bb;
    --accent: #2f6f5e; --empty: #9a958a;
    --w: 112px; --h: 64px; --gap: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161715; --ink: #ecebe6; --table: #232522; --line: #3d403a; --accent: #6fc0a8; --empty: #7b7d75; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  h1 { margin: 0; font-size: 1.4rem; }
  button { font: inherit; padding: 10px 22px; border-radius: 8px; border: 0; background: var(--accent);
    color: #fff; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .room { display: flex; flex-direction: column; gap: 40px; align-items: center; max-width: 100%; overflow-x: auto; padding: 8px; }
  .cluster { display: flex; flex-direction: column; gap: var(--gap); }
  .row { display: flex; gap: var(--gap); justify-content: center; }
  /* second row is offset by half a table so it interlocks with the first */
  .cluster .row + .row { margin-top: calc(var(--h) / -2); }
  .t { width: var(--w); height: var(--h); background: var(--table); border: 2px solid var(--line);
    border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600;
    text-align: center; cursor: pointer; user-select: none; font-family: inherit; color: inherit; padding: 0; }
  .t.empty { color: var(--empty); font-weight: 400; border-style: dashed; }
  .t.filled { border-color: var(--accent); }
  .t.locked { background: #c62828; border-color: #8e0000; color: #fff; }
  .note { color: var(--empty); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<h1>Team Seating</h1>
<button id="shuffle">Shuffle seats</button>
<div class="room" id="room"></div>
<div class="note" id="note"></div>

<script>
// Clusters of rows (table counts). Rows within a cluster interlock; clusters are separate.
const CLUSTERS = [[3,3],[4,4]];
// Starting position, row-major (row1, row2, row3, row4); null = empty table.
const START = [
  "Tubagus", null, "HANS",
  "Okto", "Dennis", "Wahyu",
  null, "Farrel", "Johan", "Frederick",
  null, "Dominicus", "Yodivan", "Malik",
];
// Seats locked (red) at start: not shuffled.
const START_LOCKED = [2]; // HANS, top-right
// Yodivan is this many times more likely to land on rows 2 or 4 than on any other free seat.
const PREFERRED_WHO = "Yodivan", PREFERRED_ROWS = [1, 3], PREFERRED_WEIGHT = 3;

const rowOf = CLUSTERS.flat().flatMap((n, r) => Array(n).fill(r));
let seats = START.slice();
const locked = new Set(START_LOCKED);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rand() { return crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32; }

function reshuffle() {
  const free = seats.map((_, i) => i).filter(i => !locked.has(i));
  const pool = free.map(i => seats[i]);
  const out = seats.slice();
  let slots = free.slice();
  // Place the preferred person first, weighted toward preferred rows.
  const p = pool.indexOf(PREFERRED_WHO);
  if (p >= 0) {
    pool.splice(p, 1);
    const w = slots.map(i => (PREFERRED_ROWS.includes(rowOf[i]) ? PREFERRED_WEIGHT : 1));
    let r = rand() * w.reduce((a, b) => a + b, 0), k = 0;
    while (k < w.length - 1 && (r -= w[k]) >= 0) k++;
    out[slots[k]] = PREFERRED_WHO;
    slots.splice(k, 1);
  }
  const rest = shuffle(pool);
  slots.forEach((i, n) => { out[i] = rest[n]; });
  seats = out;
}

function render() {
  const room = document.getElementById("room");
  room.innerHTML = "";
  let k = 0;
  for (const rows of CLUSTERS) {
    const c = document.createElement("div");
    c.className = "cluster";
    rows.forEach((n, ri) => {
      const r = document.createElement("div");
      r.className = "row";
      // Equal-length rows: shift the second by half a table to interlock.
      if (ri === 1 && n === rows[0]) r.style.transform = "translateX(calc((var(--w) + var(--gap)) / 2))";
      for (let i = 0; i < n; i++) {
        const idx = k++, name = seats[idx];
        const t = document.createElement("button");
        t.type = "button";
        t.className = "t " + (name ? "filled" : "empty") + (locked.has(idx) ? " locked" : "");
        t.textContent = name || "empty";
        t.title = locked.has(idx) ? "Locked – click to unlock" : "Click to lock in place";
        t.onclick = () => { locked.has(idx) ? locked.delete(idx) : locked.add(idx); render(); };
        r.appendChild(t);
      }
      c.appendChild(r);
    });
    room.appendChild(c);
  }
  document.getElementById("note").textContent =
    `Click a table to lock it (red) so it stays put when shuffling. ${locked.size} locked.`;
}
document.getElementById("shuffle").onclick = () => { reshuffle(); render(); };
render();
</script>
</body>
</html>
